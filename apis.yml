aid: nearpod
name: Nearpod
description: >-
  Nearpod is an interactive teaching platform for K-12 and higher-education
  classrooms, part of Renaissance. Teachers build data-driven lessons that
  combine real-time formative assessment, interactive activities (quizzes,
  polls, open-ended questions, collaborate boards, and VR field trips), and
  22,000+ curriculum-aligned lessons, delivered live (synchronous) or
  student-paced (asynchronous) with real-time reporting and insights on student
  performance. Nearpod connects to major LMS and rostering platforms (Google
  Classroom, Microsoft Teams, Canvas, Schoology, Clever, ClassLink) via LMS/LTI
  integrations, but publishes no public developer REST API.
